name: Build ZN-M2 (VIKINGYFY owrt, No-WiFi, PassWall2 Xray-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install deps
        env: { DEBIAN_FRONTEND: noninteractive }
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext git \
            libncurses5-dev libssl-dev libelf-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget swig zstd

      - name: Clone VIKINGYFY (owrt branch)
        run: |
          git clone -b owrt --depth 1 https://github.com/VIKINGYFY/immortalwrt.git openwrt
          cd openwrt
          grep -q "define Device/zn_m2" target/linux/qualcommax/image/ipq60xx.mk || { echo "::error::zn_m2 missing"; exit 1; }
          echo "== feeds.conf.default =="; cat feeds.conf.default

      # Same minimal WiFi removal as the build that could log in.
      # No perl/regex edits of Makefiles, no LAN IP override.
      - name: Remove WiFi at the source
        run: |
          cd openwrt
          sed -i '/^define Device\/zn_m2$/,/^endef$/ s/^\tDEVICE_PACKAGES := ipq-wifi-zn_m2$/\tDEVICE_PACKAGES :=/' \
            target/linux/qualcommax/image/ipq60xx.mk
          sed -i '/ath11k-firmware-ipq6018/d' target/linux/qualcommax/ipq60xx/target.mk
          echo "== result =="
          sed -n '/^define Device\/zn_m2$/,/^endef$/p' target/linux/qualcommax/image/ipq60xx.mk
          cat target/linux/qualcommax/ipq60xx/target.mk

      - name: Add PassWall2 feeds
        run: |
          cd openwrt
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
          echo "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main" >> feeds.conf.default
          ./scripts/feeds update -a

          # prefer passwall_packages for duplicated packages
          for p in xray-core v2ray-geodata sing-box chinadns-ng geoview; do
            rm -rf feeds/packages/net/$p feeds/packages/utils/$p
          done

          ./scripts/feeds install -a -p passwall_packages
          ./scripts/feeds install luci-app-passwall2
          ./scripts/feeds install -a -p luci
          ./scripts/feeds install -a -p packages

      # Record exact revisions so you can pin them later and audit diffs.
      - name: Record source revisions
        run: |
          {
            echo "source: $(git -C openwrt rev-parse HEAD)"
            for d in openwrt/feeds/*/; do
              [ -d "$d/.git" ] && echo "feed $(basename "$d"): $(git -C "$d" rev-parse HEAD)"
            done
          } | tee sources.txt

      - name: Config (minimal, Xray-only)
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y

          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y

          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y

          # PassWall2 runtime dependencies (the only additions vs the old working build)
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y

          # WiFi off
          # CONFIG_PACKAGE_wpad-basic-mbedtls is not set
          # CONFIG_PACKAGE_wpad-basic-wolfssl is not set
          # CONFIG_PACKAGE_wpad-basic is not set
          # CONFIG_PACKAGE_hostapd-common is not set
          # CONFIG_PACKAGE_kmod-ath11k is not set
          # CONFIG_PACKAGE_kmod-ath11k-ahb is not set
          # CONFIG_PACKAGE_kmod-ath11k-pci is not set
          # CONFIG_PACKAGE_kmod-ath is not set
          # CONFIG_PACKAGE_kmod-cfg80211 is not set
          # CONFIG_PACKAGE_kmod-mac80211 is not set
          EOF

          # disable every PassWall2 INCLUDE_* option except Xray
          MK=feeds/passwall2/luci-app-passwall2/Makefile
          for s in $(grep -oE 'INCLUDE_[A-Za-z0-9_]+' "$MK" | sort -u); do
            [ "$s" = "INCLUDE_Xray" ] && continue
            echo "# CONFIG_PACKAGE_luci-app-passwall2_${s} is not set" >> .config
          done

          # transparent proxy backend: nftables
          if grep -q "Nftables_Transparent_Proxy" "$MK"; then
            echo "CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y" >> .config
            if grep -q "Iptables_Transparent_Proxy" "$MK"; then
              echo "# CONFIG_PACKAGE_luci-app-passwall2_Iptables_Transparent_Proxy is not set" >> .config
            fi
          fi

          make defconfig

          echo "== PassWall2 core choice =="
          grep -E "passwall2_Basic_Core" .config || echo "no Basic_Core option found"

          echo "== i18n diagnostics =="
          grep -n "i18n-base-zh-cn" tmp/.config-package.in | head -3 || echo "i18n-base-zh-cn not defined in any feed"
          grep -E "i18n.*zh|LUCI_LANG" .config || echo "no zh/LUCI_LANG entries in .config"

          echo "== selected =="
          grep -E "passwall2|xray|geoip|geosite|dnsmasq|nft-tproxy|nft-socket" .config | grep "=y"

          echo "== must exist =="
          for p in xray-core luci-app-passwall2 v2ray-geoip v2ray-geosite dnsmasq-full kmod-nft-tproxy kmod-nft-socket; do
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || { echo "::error::MISSING $p"; exit 1; }
          done

          echo "== WiFi/extra packages pulled back in (warning only) =="
          grep -E "^CONFIG_PACKAGE_(kmod-ath|kmod-mac80211|kmod-cfg80211|ath11k|ipq-wifi|wpad|hostapd|sing-box|hysteria|naiveproxy|tuic)[a-z0-9_-]*=y" .config || echo "none"

      - name: Download
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Disk check
        run: df -h /

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Post-build check
        run: |
          cd openwrt/bin/targets/qualcommax/ipq60xx
          ls -lh
          M=$(ls *.manifest | head -1)
          echo "== WiFi/extra cores in manifest =="
          grep -E "ath11k|wpad|hostapd|ipq-wifi|mac80211|sing-box|hysteria" "$M" || echo "clean"
          echo "== NSS / wifi related (informational) =="
          grep -iE "nss|qca|ath|80211|wlan|wifi" "$M" || echo "none"
          echo "== target packages =="
          grep -E "xray-core|passwall2|geoip|geosite|dnsmasq-full|kmod-nft-tproxy|kmod-nft-socket" "$M"
          grep -q "^xray-core" "$M" || { echo "::error::xray-core not in manifest"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ZN-M2-VIKINGYFY-owrt
          path: |
            openwrt/bin/targets/qualcommax/ipq60xx/*
            openwrt/.config
            sources.txt
